<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과제 관리 앱</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111;--sub:#8a8d94;--line:#e8e9ed;--btn:#26272b;--btnt:#fff;--red:#e5484d;--redbg:#fdecee;--chip:#ececf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121214;--card:#1c1c1f;--ink:#f3f3f5;--sub:#9a9ca3;--line:#2c2c30;--btn:#f1f1f3;--btnt:#111;--redbg:#3a1f22;--chip:#2a2a2e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121214;--card:#1c1c1f;--ink:#f3f3f5;--sub:#9a9ca3;--line:#2c2c30;--btn:#f1f1f3;--btnt:#111;--redbg:#3a1f22;--chip:#2a2a2e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:20px 20px 28px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub)}
.nav button.on{color:var(--ink);font-weight:700}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--sub);font-size:13px}
.hero{background:#26272b;color:#fff;border-radius:22px;padding:18px 20px;margin:16px 0}
.hero b{font-size:34px}.hero .sub{color:#b9bbc2}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:14px;color:var(--sub)}.seg .on{background:var(--btn);color:var(--btnt);font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px 14px;margin-bottom:10px}
.row .m{flex:1;min-width:0}.row .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid #c7c9cf;display:grid;place-items:center;color:transparent;flex:none}
.cb.on{background:var(--btn);border-color:var(--btn);color:var(--btnt)}
.dd{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--chip);color:var(--sub);flex:none}.dd.hot{background:var(--redbg);color:var(--red)}
.fab{position:absolute;right:20px;bottom:86px;width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tag{font-size:10px;background:var(--chip);color:var(--sub);border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:600}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 14px;margin:0 -20px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.cd{flex:0 0 78%;scroll-snap-align:center;background:var(--card);border-radius:26px;padding:20px;min-height:300px;display:flex;flex-direction:column;transform:scale(.93);opacity:.65;transition:.25s;box-shadow:0 10px 24px rgba(0,0,0,.07)}
.cd.act{transform:none;opacity:1}.cd.fin{background:var(--chip)}.cd.fin h3{text-decoration:line-through;color:var(--sub)}
.cd .r1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);font-weight:600}
.cd h3{font-size:22px;margin:18px 0 8px}.cd p{margin:0;color:var(--sub);font-size:14px;line-height:1.55;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:14px 0}.meta span{background:var(--chip);padding:5px 9px;border-radius:99px}
.pr{padding:2px 8px;border-radius:99px;background:var(--chip)}.pr.h{background:var(--redbg);color:var(--red)}
.go{width:100%;padding:13px;border-radius:14px;background:var(--btn);color:var(--btnt);font-weight:700}.go.sec{background:var(--chip);color:var(--ink)}.go.dng{background:var(--redbg);color:var(--red)}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}.ctl button{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:200px}.dots i{width:6px;height:6px;border-radius:9px;background:#c7c9cf}.dots i.on{background:var(--ink);width:16px}
.ov{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:700}.top button{width:36px;height:36px;display:grid;place-items:center}
.lab{font-size:12px;color:var(--sub);margin:14px 0 6px;display:block}
.drop{background:var(--card);border-radius:22px;padding:36px 20px;text-align:center;margin:12px 0 16px}
.note{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;margin:10px 0}.note.ok{background:var(--chip);color:var(--ink)}
.thumb{position:relative;width:100%;max-height:170px;border-radius:14px;overflow:hidden;background:var(--chip)}.thumb img{width:100%;max-height:170px;object-fit:contain;display:block}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-h button{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.dow,.wk{display:grid;grid-template-columns:repeat(7,1fr)}.dow div{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.wk{background:var(--card);border-radius:12px;margin-bottom:6px;padding:4px 0 6px;row-gap:3px}
.dn{height:30px;display:grid;place-items:center;font-size:13px}.dn span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.dn.o{color:var(--sub);opacity:.5}.dn.t span{background:var(--btn);color:var(--btnt)}.dn.s span{outline:2px solid var(--ink)}
.gb{height:17px;margin:0 2px;border-radius:6px;font-size:10px;line-height:17px;overflow:hidden;white-space:nowrap}.gb b{background:rgba(255,255,255,.8);color:#222;border-radius:4px;padding:0 4px;margin-left:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.set{background:var(--card);border-radius:18px;padding:4px 16px;margin-bottom:14px}.set h4{margin:14px 0 4px;font-size:12px;color:var(--sub)}
.si{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:15px;width:100%;text-align:left}.si:first-of-type{border-top:0}
.tg{width:44px;height:26px;border-radius:99px;background:#c7c9cf;position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--btn)}.tg.on:after{left:21px;background:var(--btnt)}
.av{width:64px;height:64px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-size:24px;font-weight:700}
.big{text-align:center;margin-top:90px}.ckc{width:84px;height:84px;border-radius:50%;background:var(--chip);display:grid;place-items:center;margin:0 auto 18px}
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}.sheet>div{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:22px 20px 30px;max-height:80%;overflow:auto}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px;line-height:1.6}.tb{background:var(--card);border-radius:22px;padding:16px;margin-bottom:16px}.tb h3{margin:0 0 4px;font-size:16px}.tp{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.tp .m{flex:1;min-width:0;text-align:left}.tp .n{font-size:14px;font-weight:600}.tp .cb{margin-top:1px}.go:disabled{opacity:.5;cursor:default}.brd{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:12px;overflow:hidden}.brd img{width:30px;height:30px;display:block}
.au{--card:#fff;--ink:#111;--sub:#8a8d94;--line:#e8e9ed;--chip:#ececf0;--btn:#26272b;--btnt:#fff;--redbg:#fdecee;color:#111;position:absolute;inset:0;z-index:50;background:#fff;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:48px 24px 32px}.au>*{flex:none}
.lg{display:flex;align-items:center;gap:8px;margin-top:7vh}.lgi{width:64px;height:64px;opacity:0;animation:fin .6s .1s forwards}
.tk{font-size:40px;font-weight:800;letter-spacing:3px;display:flex}.tk span{opacity:0;transform:translateY(10px);animation:ltr .5s forwards}
.tg2{margin:18px 0 28px;text-align:center;color:#6b6e75;font-size:15px;line-height:1.6;opacity:0;animation:fin .7s 1.5s forwards}
.af{width:100%;max-width:340px;opacity:0;animation:fin .7s 1.9s forwards}
@keyframes fin{to{opacity:1}}@keyframes ltr{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.au *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>

function taskList(){const a=S.tasks.slice().sort(cmp);const filtered=a.filter(t=>U.filter==='all'||(U.filter==='done'?t.done:!t.done));return`<h1>과제</h1><div class="sub">과제와 세부 할 일을 관리해요</div><div class="seg" style="margin-top:16px"><button class="${U.filter==='today'?'on':''}" onclick="A.filter('today')">진행 중</button><button class="${U.filter==='done'?'on':''}" onclick="A.filter('done')">완료</button><button class="${U.filter==='all'?'on':''}" onclick="A.filter('all')">전체</button></div>${filtered.length?filtered.map(t=>{const p=prio(t),l=left(t),n=t.steps.filter(s=>s.done).length;return`<div class="row"><button class="cb ${t.done?'on':''}" onclick="A.finish('${t.id}')">${svg('ck',14)}</button><button class="m" onclick="A.detail('${t.id}')"><div class="n">${esc(t.name)}</div><div class="sub">${fdue(t.due)} · ${n}/${t.steps.length}단계 완료</div></button><span class="dd ${p[1]}">${dd(l)}</span></div>`}).join(''):'<div class="empty">표시할 과제가 없어요.</div>'}`}
function calendar(){const first=new Date(U.y,U.m,1),start=addD(first,-first.getDay()),today=ds(T0());let h=`<h1>캘린더</h1><div class="sub">과제 마감일과 일정을 한눈에 확인해요</div><div class="cal-h" style="margin-top:16px"><button onclick="A.month(-1)">${svg('l')}</button><b>${U.y}년 ${U.m+1}월</b><button onclick="A.month(1)">${svg('r')}</button></div><div class="dow">${'일월화수목금토'.split('').map(x=>`<div>${x}</div>`).join('')}</div>`;
for(let w=0;w<6;w++){h+='<div class="wk">';for(let j=0;j<7;j++){const d=addD(start,w*7+j),key=ds(d),other=d.getMonth()!==U.m,ts=S.tasks.filter(t=>t.due.slice(0,10)===key),es=S.events.filter(e=>e.start<=key&&key<=e.end);h+=`<div><button class="dn ${other?'o':''} ${key===today?'t':''} ${key===U.sel?'s':''}" onclick="A.select('${key}')"><span>${d.getDate()}</span></button>${ts.slice(0,2).map(t=>`<div class="gb" style="background:rgba(139,111,232,.22);color:var(--ink)" onclick="A.detail('${t.id}')">● ${esc(t.name)}</div>`).join('')}${es.slice(0,1).map(e=>`<div class="gb" style="background:rgba(60,180,120,.2);color:var(--ink)">● ${esc(e.title)}</div>`).join('')}</div>`}h+='</div>'}
h+=`<div style="margin-top:16px"><b>${U.sel.slice(5).replace('-','월 ')}일 일정</b></div>`;
const ts=S.tasks.filter(t=>t.due.slice(0,10)===U.sel),es=S.events.filter(e=>e.start<=U.sel&&U.sel<=e.end);
h+=ts.map(t=>`<div class="row" onclick="A.detail('${t.id}')"><span class="sw" style="background:rgb(139,111,232)"></span><div class="m"><div class="n">${esc(t.name)}</div><div class="sub">과제 마감</div></div><span class="dd ${prio(t)[1]}">${dd(left(t))}</span></div>`).join('');
h+=es.map(e=>`<div class="row"><span class="sw" style="background:rgb(60,180,120)"></span><div class="m"><div class="n">${esc(e.title)}</div><div class="sub">일정</div></div></div>`).join('');
if(!ts.length&&!es.length)h+='<div class="empty">등록된 일정이 없어요.</div>';
return h+`<button class="go sec" onclick="A.evForm()">+ 일정 추가</button>`}
